<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Securitate - Autentificare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 relative flex items-center justify-center min-h-screen overflow-hidden">
    
    <!-- Efecte de fundal (Glowing orbs) -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Card Autentificare -->
    <div class="bg-slate-900/60 backdrop-blur-xl p-8 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-slate-800 w-full max-w-md z-10">
        <div class="flex justify-center mb-4">
            <div class="w-12 h-12 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-cyan-500/30">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
        </div>
        <h1 class="text-2xl font-bold text-white text-center mb-6">Autentificare</h1>
        <div class="space-y-5">
            <div>
                <input type="email" id="email" placeholder="Adresă email" class="w-full p-3.5 bg-slate-950/50 border border-slate-800 text-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all placeholder-slate-500">
            </div>
            <div>
                <input type="password" id="password" placeholder="Parolă" class="w-full p-3.5 bg-slate-950/50 border border-slate-800 text-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all placeholder-slate-500">
            </div>
            <button id="btnLogin" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold py-3.5 rounded-xl hover:shadow-[0_0_20px_rgba(8,145,178,0.4)] transition-all duration-300 transform hover:-translate-y-0.5">Conectare</button>
            <div class="text-center pt-4 border-t border-slate-800">
                <span class="text-sm text-slate-400">Nu aveți un cont?</span>
                <a href="register.html" class="text-sm text-cyan-400 font-bold hover:text-cyan-300 hover:underline ml-1 transition-colors">Creați unul!</a>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
