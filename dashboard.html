<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Securitate - Panou de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 min-h-screen">

    <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex justify-between items-center fixed top-0 w-full z-40">
        <div class="font-bold text-xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 flex items-center gap-2">
            <div class="w-3 h-3 bg-cyan-500 rounded-full animate-pulse"></div>
            Sistem Analiză Securitate
        </div>
        
        <div class="relative">
            <button id="userMenuBtn" class="flex items-center focus:outline-none hover:scale-105 transition-transform">
                <div class="w-10 h-10 bg-gradient-to-br from-cyan-600 to-blue-700 text-white rounded-full flex items-center justify-center font-bold shadow-lg shadow-cyan-500/20">U</div>
            </button>
            <div id="userDropdown" class="hidden absolute right-0 mt-3 w-56 bg-slate-800 rounded-xl shadow-2xl border border-slate-700 py-2 transform origin-top-right transition-all">
                <p id="userEmailDisplay" class="px-4 py-3 text-xs text-cyan-400 border-b border-slate-700 break-all font-mono"></p>
                <button id="btnLogout" class="w-full text-left px-4 py-3 text-sm text-red-400 hover:bg-slate-700/50 hover:text-red-300 transition-colors font-semibold flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Deconectare sistem
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto pt-28 pb-12 px-4 relative z-10">
        <div class="absolute top-20 left-1/2 -translate-x-1/2 w-3/4 h-64 bg-cyan-600/10 rounded-full blur-[100px] pointer-events-none"></div>

        <div class="bg-slate-900/80 backdrop-blur-xl p-10 rounded-3xl shadow-2xl border border-slate-800 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-500 to-transparent opacity-50"></div>
            
            <h2 class="text-3xl font-bold text-white mb-3">Analiză Resurse URL</h2>
            <p class="text-slate-400 mb-10 text-sm">Introduceți adresa URL pentru verificarea integrității prin motorul <span class="text-cyan-400 font-semibold">VirusTotal</span>.</p>

            <div class="flex flex-col sm:flex-row gap-4 max-w-3xl mx-auto">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                    </div>
                    <input type="text" id="vtLink" class="w-full pl-11 pr-4 py-4 bg-slate-950/50 border border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all text-white placeholder-slate-500 font-mono text-sm" placeholder="https://exemplu.ro">
                </div>
                <button id="btnScan" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-8 py-4 rounded-xl transition-all shadow-[0_0_15px_rgba(8,145,178,0.3)] hover:shadow-[0_0_25px_rgba(8,145,178,0.6)] flex items-center justify-center gap-2 min-w-[200px]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    Inițiază Analiza
                </button>
            </div>

            <!-- BUTON NOU PENTRU ISTORIC -->
            <button id="btnHistory" class="mt-8 text-slate-400 hover:text-cyan-400 text-sm font-medium transition-colors flex items-center justify-center gap-2 mx-auto">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Vezi Arhiva de Scanări
            </button>

            <div id="result-section" class="hidden mt-8 text-left transition-all duration-300"></div>
        </div>
    </main>

    <!-- FEREASTRĂ MODALĂ PENTRU ISTORIC -->
    <div id="historyModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-3xl max-h-[80vh] flex flex-col overflow-hidden transform scale-95 transition-transform duration-300" id="historyModalContent">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-800/50">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                    Istoric Scanări
                </h2>
                <button id="closeHistory" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-700 transition-colors">✕</button>
            </div>
            <div id="historyList" class="p-6 overflow-y-auto flex-1 space-y-3">
                <!-- Aici se vor injecta rezultatele din DB -->
            </div>
        </div>
    </div>

    <!-- Asistent AI Chat -->
    <div id="chat-wrapper" class="fixed bottom-6 right-6 z-50">
        <div id="chat-container" class="hidden bg-slate-900 shadow-[0_0_40px_rgba(0,0,0,0.5)] rounded-2xl border border-slate-700 flex flex-col h-[500px] w-80 md:w-96 overflow-hidden transform transition-all">
            <div class="p-4 border-b border-slate-800 bg-slate-800/80 backdrop-blur flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border-2 border-slate-800 rounded-full"></div>
                    </div>
                    <div>
                        <span class="font-bold text-white text-sm block">Gemini AI</span>
                        <span class="text-xs text-slate-400">Online - Gata de analiză</span>
                    </div>
                </div>
                <button id="closeChat" class="text-slate-400 hover:text-white transition-colors bg-slate-700/50 p-1.5 rounded-lg">✕</button>
            </div>
            
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 text-sm bg-slate-950/50 flex flex-col">
                <div class="bg-slate-800 p-3.5 rounded-tr-2xl rounded-br-2xl rounded-bl-2xl text-slate-300 border border-slate-700 shadow-sm max-w-[85%]">
                    Sistemul este pregătit. Cum te pot asista în procesul de analiză a securității astăzi?
                </div>
            </div>

            <div class="p-3 border-t border-slate-800 bg-slate-900 flex gap-2">
                <input type="text" id="chatInput" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all placeholder-slate-500" placeholder="Scrie comanda aici...">
                <button id="sendChat" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl hover:bg-blue-500 transition-colors shadow-lg shadow-blue-600/20">
                    <svg class="w-4 h-4 transform rotate-45 -mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </div>

        <button id="openChat" class="ml-auto mt-4 bg-gradient-to-r from-blue-600 to-cyan-600 text-white p-4 rounded-full shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:scale-110 transition-all duration-300 flex items-center justify-center group relative">
            <div class="absolute inset-0 rounded-full bg-blue-400 opacity-0 group-hover:opacity-20 animate-ping"></div>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 relative z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
        </button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
