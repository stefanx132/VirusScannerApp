<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Securitate - Înregistrare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 relative flex items-center justify-center min-h-screen overflow-hidden">
    
    <div class="absolute top-1/4 left-3/4 w-96 h-96 bg-emerald-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="bg-slate-900/60 backdrop-blur-xl p-8 rounded-2xl shadow-2xl border border-slate-800 w-full max-w-md z-10">
        <h1 class="text-2xl font-bold text-white text-center mb-6">Creare cont</h1>
        <div class="space-y-4">
            <input type="email" id="regEmail" placeholder="Adresă email" class="w-full p-3.5 bg-slate-950/50 border border-slate-800 text-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all placeholder-slate-500">
            <input type="password" id="regPassword" placeholder="Introduceți parola" class="w-full p-3.5 bg-slate-950/50 border border-slate-800 text-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all placeholder-slate-500">
            <input type="password" id="confirmPassword" placeholder="Confirmați parola" class="w-full p-3.5 bg-slate-950/50 border border-slate-800 text-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all placeholder-slate-500">
            
            <button id="btnFinalizeRegister" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold py-3.5 rounded-xl hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] transition-all duration-300 transform hover:-translate-y-0.5 mt-2">
                Înregistrare
            </button>
            <div class="text-center pt-4 border-t border-slate-800 mt-4">
                <a href="index.html" class="text-sm text-slate-400 hover:text-white hover:underline transition-colors">← Înapoi la conectare</a>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
